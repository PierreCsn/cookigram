<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8ed">
  <script>
    (function() {
      var saved = localStorage.getItem('cookigram:theme') || localStorage.getItem('cookgram:theme');
      var dark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#171614' : '#fff8ed');
    })();
  </script>
  <meta name="description" content="CookiGram, le carnet de recettes guidées et hors ligne.">
  <link rel="manifest" href="{{ prefix }}manifest.webmanifest">
  <link rel="stylesheet" href="{{ prefix }}assets/app.css?v={{ asset_version or '' }}">
  <link rel="stylesheet" href="{{ prefix }}assets/scaling.css?v={{ asset_version or '' }}">
  <link rel="stylesheet" href="{{ prefix }}assets/variants.css?v={{ asset_version or '' }}">
  <link rel="stylesheet" href="{{ prefix }}assets/images.css?v={{ asset_version or '' }}">
  <title>{% block title %}CookiGram{% endblock %}</title>
</head>
<body data-prefix="{{ prefix }}">
  {% block body %}{% endblock %}
  <div class="toast" role="status" aria-live="polite" hidden></div>
  <script src="{{ prefix }}assets/app.js?v={{ asset_version or '' }}" defer></script>
</body>
</html>
