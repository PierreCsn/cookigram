name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          PYTHON: python

  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check generator plugins tests

      - name: Check formatting with Ruff
        run: |
          ruff format --check generator plugins tests

      - name: Type check with mypy
        run: |
          mypy generator/

      - name: Lint JavaScript with Biome
        run: |
          npm ci
          npm run lint

      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/sw.js
          for f in static/js/modules/*.js; do node --check "$f"; done

      - name: Run JavaScript unit tests
        run: |
          npm run test:unit


      - name: Run tests with pytest & coverage
        run: |
          pytest --cov=generator --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80

      - name: Validate complete site build & recipes
        run: |
          python -m generator.build
