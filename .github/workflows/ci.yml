name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe-check:
    name: Validation Recettes & Build (< 15s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Checkout CookiGram Core Engine (Private)
        if: ${{ env.HAVE_CORE_KEY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: PierreCsn/cookigram-core
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          path: core
        env:
          HAVE_CORE_KEY: ${{ secrets.CORE_SSH_KEY != '' }}

      - name: Validation avec CookiGram Core
        if: ${{ env.HAVE_CORE_KEY == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install ./core
          python -m generator.recipe_check --root .
          python -m generator.build --content-dir . --output /tmp/_test_site
        env:
          HAVE_CORE_KEY: ${{ secrets.CORE_SSH_KEY != '' }}

      - name: Contrôle YAML de secours (Fork PR sans secret)
        if: ${{ env.HAVE_CORE_KEY != 'true' }}
        run: |
          pip install pyyaml
          python -c "
          from pathlib import Path
          import yaml

          for yml in sorted(Path('.gram').glob('*.yaml')):
              print(f'Validating {yml}...')
              with open(yml, encoding='utf-8') as f:
                  yaml.safe_load(f)
          print('All .gram YAML files are syntactically valid.')
          "
        env:
          HAVE_CORE_KEY: ${{ secrets.CORE_SSH_KEY != '' }}
