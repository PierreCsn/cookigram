name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe-check:
    name: Validation du contrat public (< 15s)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Contrat public non publié
        run: |
          echo "::error::Le contrat public CookiGram v1.0 n'est pas encore publié."
          echo "::error::Publiez l'artefact versionné décrit dans docs/PUBLIC-CONTRACT.md avant d'activer cette validation."
          exit 1

  private-integration:
    name: Intégration Core privée (push de confiance uniquement)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      HAVE_CORE_KEY: ${{ secrets.CORE_SSH_KEY != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4

      - name: Read pinned Core SHA
        id: core-ref
        run: echo "sha=$(cat .core-version | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Checkout CookiGram Core Engine (Private)
        if: ${{ env.HAVE_CORE_KEY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: PierreCsn/cookigram-core
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          ref: ${{ steps.core-ref.outputs.sha }}
          path: core

      - name: Validation avec CookiGram Core
        if: ${{ env.HAVE_CORE_KEY == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ./core
          python -m generator.recipe_check --root .
          python -m generator.build --content-dir . --output /tmp/_test_site

      - name: Audit des illustrations et prompts
        run: python scripts/audit-recipe-images.py --check
