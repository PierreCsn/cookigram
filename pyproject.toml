[project]
name = "cookgram"
version = "0.1.0"
description = "Carnet de recettes Gram, PWA statique et mode cuisson guidée"
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["generator"]
