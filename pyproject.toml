[project]
name = "cookigram"
version = "0.1.0"
description = "Carnet de recettes Gram, PWA statique et mode cuisson guidée CookiGram"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3",
    "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["generator"]
strict = false
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.setuptools]
packages = ["generator"]
